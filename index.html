<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="logo">WRITING WORLD</span>
    </div>
    <div id="search-wrapper">
      <input type="search" id="search-input" placeholder="Search all entries..." autocomplete="off" />
    </div>
    <nav id="type-nav"></nav>
    <div class="sidebar-footer">
      <button id="btn-export">&#8593; Export JSON</button>
      <label class="btn-file">
        &#8595; Import JSON
        <input type="file" id="import-file" accept=".json" />
      </label>
    </div>
  </aside>

  <div id="list-panel">
    <div id="list-header"></div>
    <div id="entity-list"></div>
  </div>

  <div id="detail-panel">
    <div id="detail-content"></div>
  </div>

  <footer id="statusbar">
    <span id="status-text">Ready</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
