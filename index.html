<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lore</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "@huggingface/transformers": "https://lore.malha.land/vendor/lore-ai.mjs",
      "onnxruntime-web/webgpu":    "https://lore.malha.land/vendor/ort-webgpu.mjs"
    }
  }
  </script>
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="logo">LORE</span>
    </div>
    <div id="search-wrapper">
      <input type="search" id="search-input" placeholder="Search all entries..." autocomplete="off" />
    </div>
    <nav id="type-nav"></nav>
    <div id="saves-panel">
      <div class="saves-panel-head">LOCAL SAVES</div>
      <div class="saves-create">
        <input id="save-name-input" type="text" placeholder="Name this save..." autocomplete="off">
        <button id="btn-do-save">Save</button>
      </div>
      <div id="saves-list-inner" class="saves-list"></div>
      <div class="saves-io">
        <button id="btn-export">&#8593; Export JSON</button>
        <label class="btn-file">
          &#8595; Import JSON
          <input type="file" id="import-file" accept=".json" />
        </label>
      </div>
    </div>
    <div class="sidebar-footer">
      <button id="btn-chat-toggle">◎ Assistant</button>
      <button id="btn-saves">&#9632; Saves</button>
      <button id="btn-about">◈ About Lore</button>
      <div class="theme-toggle">
        <button id="btn-theme-light" title="Light">☀</button>
        <button id="btn-theme-system" title="System">◐</button>
        <button id="btn-theme-dark" title="Dark">☾</button>
      </div>
      <div id="auth-status"></div>
    </div>
  </aside>

  <div id="list-panel">
    <div id="list-header"></div>
    <div id="entity-list"></div>
  </div>

  <div id="detail-panel">
    <div id="detail-content"></div>
  </div>

  <div id="board-panel">
    <div id="board-toolbar"></div>
    <div id="board-canvas"></div>
  </div>

  <div id="board-modal" class="board-modal-overlay">
    <div class="board-modal-box">
      <button id="btn-board-modal-close">&#215;</button>
      <div id="board-modal-body"></div>
    </div>
  </div>

  <!-- Chat panel (slide-out, independent of main view routing) -->
  <div id="chat-overlay"></div>
  <div id="chat-panel">
    <div id="chat-header">
      <div id="chat-header-title">
        <span class="chat-header-icon">◎</span>
        <span>Lore Assistant</span>
        <span class="chat-header-badge">local · SmolLM2</span>
      </div>
      <div id="chat-header-actions">
        <button id="chat-clear" title="Clear conversation">↺</button>
        <button id="chat-close" title="Close">✕</button>
      </div>
    </div>
    <div id="chat-body"></div>
    <div id="chat-footer">
      <textarea id="chat-input" placeholder="Ask about your lore…" rows="1" autocomplete="off" spellcheck="false"></textarea>
      <button id="chat-send" title="Send (Enter)">↑</button>
    </div>
  </div>

  <div id="sync-banner"></div>
  <footer id="statusbar">
    <span id="status-text">Ready</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
