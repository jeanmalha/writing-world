AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Writing World — S3 + CloudFront + ACM + Route 53
  Hosted at lore.malha.land

# ── Notes ────────────────────────────────────────────────────────────────────
# • This stack MUST be deployed to us-east-1 because ACM certificates used
#   by CloudFront must live in that region.
# • CloudFront itself is a global service — your content is served from edge
#   locations worldwide regardless of the stack region.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  HostedZoneId:
    Type: String
    Default: Z0361576365F5A0HG4AS4
    Description: Route 53 Hosted Zone ID for malha.land

  DomainName:
    Type: String
    Default: lore.malha.land
    Description: Full domain name for the site

  ApiGatewayDomain:
    Type: String
    Default: ''
    Description: API Gateway domain (e.g. abc123.execute-api.us-east-1.amazonaws.com) — set after backend stack is deployed

Resources:

  # ── CloudFront Function: convert S3 403 (missing key) → 404 ─────────────────
  # S3 returns 403 for missing keys when public access is blocked.
  # We map only 404 → index.html for the SPA, so API Gateway 403s pass through.
  S3ErrorRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: WritingWorldS3ErrorRewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite S3 403 to 404 so SPA fallback only catches missing S3 keys
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          if (response.statusCode === 403) {
            response.statusCode = 404;
            response.statusDescription = 'Not Found';
          }
          // Enable SharedArrayBuffer — required for threaded WASM and WebGPU.
          // COEP 'credentialless' is less strict than 'require-corp': cross-origin
          // sub-resources load without credentials rather than being blocked.
          response.headers['cross-origin-opener-policy'] = { value: 'same-origin' };
          response.headers['cross-origin-embedder-policy'] = { value: 'credentialless' };
          response.headers['x-content-type-options'] = { value: 'nosniff' };
          response.headers['x-frame-options'] = { value: 'DENY' };
          response.headers['referrer-policy'] = { value: 'strict-origin-when-cross-origin' };
          response.headers['content-security-policy'] = { value: [
            "default-src 'none'",
            "script-src 'self' https://cdn.jsdelivr.net",
            "worker-src blob: https://cdn.jsdelivr.net",
            "connect-src 'self' https://*.auth.us-east-1.amazoncognito.com https://*.execute-api.us-east-1.amazonaws.com https://client.rum.us-east-1.amazonaws.com https://dataplane.rum.us-east-1.amazonaws.com",
            "img-src 'self' data:",
            "style-src 'self' 'unsafe-inline'",
            "font-src 'self'",
            "frame-ancestors 'none'",
            "base-uri 'self'",
            "object-src 'none'"
          ].join('; ') };
          return response;
        }

  # ── SSL Certificate ─────────────────────────────────────────────────────────
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: WritingWorld

  # ── S3 Bucket ───────────────────────────────────────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub lore-malha-land-${AWS::AccountId}
      # No public access — CloudFront talks to it via OAC
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: WritingWorld

  # ── Bucket Policy: allow CloudFront OAC to GetObject ───────────────────────
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ── Origin Access Control (modern OAC, replaces legacy OAI) ────────────────
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: WritingWorldOAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Distribution ─────────────────────────────────────────────────
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Writing World — lore.malha.land
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: ApiOrigin
            DomainName: !Ref ApiGatewayDomain
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (AWS managed)
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods:  [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-response
              FunctionARN: !GetAtt S3ErrorRewrite.FunctionARN

        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            # 4135ea2d = CachingDisabled managed policy (no caching for API)
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods:  [GET, HEAD]
            Compress: false

        # SPA fallback: only catch 404.
        # S3 403s (missing keys) are rewritten to 404 by the S3ErrorRewrite function.
        # API Gateway 401/403 errors are NOT caught here — they pass through cleanly.
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        HttpVersion: http2and3
        PriceClass: PriceClass_100  # US, Canada, Europe edge locations

      Tags:
        - Key: Project
          Value: WritingWorld

  # ── Route 53 A + AAAA alias records → CloudFront ───────────────────────────
  DnsRecordIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed hosted zone ID
        EvaluateTargetHealth: false

  DnsRecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Description: S3 bucket to deploy files into
    Value: !Ref SiteBucket
    Export:
      Name: WritingWorldBucket

  DistributionId:
    Description: CloudFront distribution ID (needed for cache invalidations)
    Value: !Ref Distribution
    Export:
      Name: WritingWorldDistributionId

  DistributionDomain:
    Description: CloudFront domain (use before DNS propagates)
    Value: !GetAtt Distribution.DomainName

  SiteUrl:
    Description: Live URL
    Value: !Sub https://${DomainName}
