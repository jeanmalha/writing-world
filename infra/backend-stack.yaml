AWSTemplateFormatVersion: '2010-09-09'
Description: Writing World Backend - Cognito + HTTP API + Lambda (Strands) + Bedrock + DynamoDB

Parameters:
  CognitoDomainPrefix:
    Type: String
    Description: Globally-unique prefix for the Cognito hosted-UI domain

  FrontendOrigin:
    Type: String
    Default: https://lore.malha.land

  SimpleModel:
    Type: String
    Default: openai.gpt-oss-20b-1:0
    Description: Fast model for Simple mode

  ComplexModel:
    Type: String
    Default: global.anthropic.claude-sonnet-4-6
    Description: Thorough model for Complex mode

  LambdaBucket:
    Type: String
    Description: S3 bucket holding lambda/extract.zip (set by deploy-backend.sh)


Resources:

  # ── Cognito ──────────────────────────────────────────────────────────────────

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: WritingWorldUsers
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "You've been invited to Lore"
          EmailMessage: "<p>Hello {username},</p><p>You have been invited to <strong>Lore</strong>, a knowledge management tool for writers.</p><p>Your temporary password is: <strong>{####}</strong></p><p>Sign in at <a href=\"https://lore.malha.land\">lore.malha.land</a> — you will be prompted to set a new password on first login.</p><p>— The Lore team</p>"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: WritingWorldWeb
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      CallbackURLs:
        - !Sub '${FrontendOrigin}/'
        - 'http://localhost:8080/'
      LogoutURLs:
        - !Sub '${FrontendOrigin}/'
        - 'http://localhost:8080/'

  # ── S3 bucket for interest form submissions ──────────────────────────────────

  InterestBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'writing-world-interest-${AWS::AccountId}'

  # ── S3 temp bucket for PDF page data ────────────────────────────────────────

  PdfTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'writing-world-pdf-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePdfJobs
            Status: Enabled
            ExpirationInDays: 1

  # ── DynamoDB ─────────────────────────────────────────────────────────────────

  WorldTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: writing-world-data
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: writing-world-jobs
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: writing-world-usage
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UsageTiersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: writing-world-tiers
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: tierId
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: tierId
          AttributeType: S

  # ── Cognito groups ────────────────────────────────────────────────────────────

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Platform administrators

  ExplorerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: explorer
      UserPoolId: !Ref UserPool
      Description: Explorer tier — basic model, entry-level limits

  TrailblazerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: trailblazer
      UserPoolId: !Ref UserPool
      Description: Trailblazer tier — complex model, generous limits

  UnchartedGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: uncharted
      UserPoolId: !Ref UserPool
      Description: Uncharted tier — complex model, unlimited

  # ── IAM Role (shared by both Lambda functions) ───────────────────────────────

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WritingWorldLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WritingWorldLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt JobsTable.Arn
                  - !GetAtt WorldTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt UsageTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt UsageTiersTable.Arn
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminDeleteUser
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:writing-world-*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${PdfTempBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt InterestBucket.Arn
                  - !Sub '${InterestBucket.Arn}/*'

  # ── Processor Lambda (Strands agent, async, long timeout) ───────────────────

  ProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: writing-world-processor
      Runtime: python3.12
      Handler: index.process
      Role: !GetAtt LambdaRole.Arn
      Timeout: 600
      MemorySize: 512
      Environment:
        Variables:
          SIMPLE_MODEL: !Ref SimpleModel
          COMPLEX_MODEL: !Ref ComplexModel
          JOBS_TABLE: !Ref JobsTable
          WORLD_TABLE: !Ref WorldTable
          PDF_BUCKET: !Ref PdfTempBucket
          INTEREST_BUCKET: !Ref InterestBucket
          PROCESSOR_ARN: ''
          USAGE_TABLE: !Ref UsageTable
          TIERS_TABLE: !Ref UsageTiersTable
          USER_POOL_ID: !Ref UserPool
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: lambda/extract.zip

  # ── API Lambda (thin handler, returns jobId immediately) ─────────────────────

  ExtractFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: writing-world-extract
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SIMPLE_MODEL: !Ref SimpleModel
          COMPLEX_MODEL: !Ref ComplexModel
          JOBS_TABLE: !Ref JobsTable
          WORLD_TABLE: !Ref WorldTable
          PDF_BUCKET: !Ref PdfTempBucket
          INTEREST_BUCKET: !Ref InterestBucket
          PROCESSOR_ARN: !GetAtt ProcessorFunction.Arn
          USAGE_TABLE: !Ref UsageTable
          TIERS_TABLE: !Ref UsageTiersTable
          USER_POOL_ID: !Ref UserPool
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: lambda/extract.zip

  # ── HTTP API ─────────────────────────────────────────────────────────────────

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: writing-world-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - http://localhost:8080
        AllowMethods:
          - POST
          - GET
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 3600

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      Name: CognitoJWT
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  ExtractIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ExtractFunction.Arn
      PayloadFormatVersion: '2.0'

  PostInterestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /interest
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetWorldRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /world
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  PutWorldRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /world
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  ExtractRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /extract
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetExtractRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /extract/{jobId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  PostExtractPdfRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /extract-pdf
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetExtractPdfRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /extract-pdf/{jobId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  PostAnalyzeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /analyze
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetAnalyzeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /analyze/{jobId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetAdminUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /admin/users
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  PostAdminUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /admin/users
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetAdminStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /admin/status
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  DeleteAdminUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /admin/users/{username}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetAdminTiersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /admin/tiers
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  PutAdminTierRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /admin/tiers/{tierId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  GetAdminUsageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /admin/usage
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ExtractIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: api
      AutoDeploy: true

  ExtractPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExtractFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

  CognitoDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'

  ApiEndpoint:
    Value: !Sub '${HttpApi.ApiEndpoint}/api'
